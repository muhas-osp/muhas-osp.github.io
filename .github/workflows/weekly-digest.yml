name: Weekly funding digest

# Daily 06:37 EAT. Mondays: build the digest from data/grants.json and queue eligible staff.
# Every day: email queued staff from ospmuhas@gmail.com, at most 499 per day.
# Secrets: REDCAP_STAFF_TOKEN (staff project, export), GMAIL_APP_PASSWORD (Google app password).
# Addresses are read at send time only; logs and data/digest_state.json hold counts and record_ids.

on:
  schedule:
    - cron: '37 3 * * *'   # daily 06:37 Africa/Dar_es_Salaam (digest built on Mondays)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and count only (write nothing to REDCap)
        type: boolean
        default: true
      only_records:
        description: Send only to these record_ids, comma-separated (testing)
        type: string
        default: ''
      test_to:
        description: Send one sample to this address only (testing)
        type: string
        default: ''
      force:
        description: Build a new digest now (not waiting for Monday)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: funding-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build and send digest
        env:
          REDCAP_STAFF_TOKEN: ${{ secrets.REDCAP_STAFF_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TEST_TO: ${{ inputs.test_to }}
          DIGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          DIGEST_ONLY_RECORDS: ${{ inputs.only_records }}
          DIGEST_FORCE: ${{ inputs.force && '1' || '' }}
        run: python scripts/queue_digest.py
      - name: Save digest state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digest_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Funding digest sent ($(TZ=Africa/Dar_es_Salaam date +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
